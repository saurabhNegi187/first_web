<?xml version="1.0" encoding="UTF-8"?>
<!--
  Vidyamrit emblem
  Concept: an open book (knowledge) with a rising flame / diya (amrit, the light of learning),
  enclosed in a gold seal. Uses currentColor-independent explicit brand tokens so it renders
  identically wherever it is placed. Swap freely for a raster logo.png if ever required.
-->
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vidyamrit emblem">
  <defs>
    <linearGradient id="vm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c76a"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <linearGradient id="vm-royal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3a8f"/>
      <stop offset="1" stop-color="#0d1f52"/>
    </linearGradient>
    <linearGradient id="vm-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d888"/>
      <stop offset="0.55" stop-color="#e6b73f"/>
      <stop offset="1" stop-color="#c9821f"/>
    </linearGradient>
  </defs>

  <!-- Seal ring -->
  <circle cx="60" cy="60" r="55" fill="url(#vm-royal)"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="url(#vm-gold)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="url(#vm-gold)" stroke-width="1" opacity="0.5"/>

  <!-- Rising flame of knowledge -->
  <path d="M60 24
           C 66 34, 72 40, 72 50
           C 72 59, 66 64, 60 64
           C 54 64, 48 59, 48 50
           C 48 40, 54 34, 60 24 Z" fill="url(#vm-flame)"/>
  <path d="M60 36
           C 63 42, 66 45, 66 51
           C 66 57, 63 60, 60 60
           C 57 60, 54 57, 54 51
           C 54 45, 57 42, 60 36 Z" fill="#fff4d6" opacity="0.85"/>

  <!-- Open book -->
  <path d="M30 68 L58 74 L58 92 L30 86 Z" fill="url(#vm-gold)"/>
  <path d="M90 68 L62 74 L62 92 L90 86 Z" fill="url(#vm-gold)"/>
  <path d="M30 68 L58 74 L58 92 L30 86 Z" fill="none" stroke="#0d1f52" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M90 68 L62 74 L62 92 L90 86 Z" fill="none" stroke="#0d1f52" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="60" y1="74" x2="60" y2="92" stroke="#0d1f52" stroke-width="1.6"/>
  <!-- Page lines -->
  <line x1="36" y1="76" x2="54" y2="80" stroke="#0d1f52" stroke-width="0.9" opacity="0.55"/>
  <line x1="36" y1="80" x2="54" y2="84" stroke="#0d1f52" stroke-width="0.9" opacity="0.55"/>
  <line x1="66" y1="80" x2="84" y2="76" stroke="#0d1f52" stroke-width="0.9" opacity="0.55"/>
  <line x1="66" y1="84" x2="84" y2="80" stroke="#0d1f52" stroke-width="0.9" opacity="0.55"/>
</svg>
